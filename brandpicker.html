<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGA Palette Selector</title>
    <style>
        :root {
            --my-background: #f0f0f0;
            --my-foreground: #333;
            --my-accent: #FFFFFF;
        }

        @font-face {
            font-family: "HORIZON1994";
            src: url("horizon1994-large-corrected.woff2");
            font-smooth: never;
            -webkit-font-smoothing: none;
        }

        @font-face {
            font-family: "Courier Prime";
            src: url("CourierPrime-Regular.ttf");
        }

        @font-face {
            font-family: "MONKEY.000";
            src: url("MONKEY.000.ttf");
        }

        @font-palette-values --DefaultPalette {
            font-family: "MONKEY.000";
            override-colors: 0 #FFFFFF;
        }

        body {
            font-family: "MONKEY.000", "Courier Prime", Courier, monospace;
            background-color: var(--my-background);
            padding: 20px;
            color: var(--my-foreground);
            font-palette: --DefaultPalette;
        }

        h1 {
            font-family: "HORIZON1994";
            text-align: center;
            text-transform: uppercase;
            padding-bottom: 10px;
            font-weight: normal;
            font-style: normal;
            background-color: var(--my-accent);
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .color-card {
            font-family: "Courier Prime";
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .swatch {
            width: 60px;
            height: 60px;
            border: 1px solid #000;
            flex-shrink: 0;
        }

        .info {
            flex-grow: 1;
        }

        .color-name {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        button {
            cursor: pointer;
            font-size: 0.7rem;
            padding: 4px;
            border: 1px solid #333;
            background: #eee;
            text-align: left;
        }

        button:hover {
            background: #ddd;
        }
    </style>
</head>
<body>

    <h1>VILLE SUNDELL - DIGIVIHREÄ</h1>

    <p style="text-align:center;">Leipäteksti</p>

    <div class="palette-grid" id="palette">
        </div>

    <script>
        const egaColors = [
            { name: "Black", hex: "#000000" },
            { name: "Blue", hex: "#0000AA" },
            { name: "Green", hex: "#00AA00" },
            { name: "Cyan", hex: "#00AAAA" },
            { name: "Red", hex: "#AA0000" },
            { name: "Magenta", hex: "#AA00AA" },
            { name: "Brown", hex: "#AA5500" },
            { name: "White (Light Gray)", hex: "#AAAAAA" },
            { name: "Gray (Dark Gray)", hex: "#555555" },
            { name: "Bright Blue", hex: "#5555FF" },
            { name: "Bright Green", hex: "#55FF55" },
            { name: "Bright Cyan", hex: "#55FFFF" },
            { name: "Bright Red", hex: "#FF5555" },
            { name: "Bright Magenta", hex: "#FF55FF" },
            { name: "Bright Yellow", hex: "#FFFF55" },
            { name: "Bright White", hex: "#FFFFFF" }
        ];

        const paletteContainer = document.getElementById('palette');

        egaColors.forEach(color => {
            const card = document.createElement('div');
            card.className = 'color-card';
            
            card.innerHTML = `
                <div class="swatch" style="background-color: ${color.hex};"></div>
                <div class="info" style="color:black;">
                    <span class="color-name">${color.name}</span>
                    <code>${color.hex}</code>
                </div>
                <div class="controls">
                    <button onclick="setBg('${color.hex}')">TAUSTA</button>
                    <button onclick="setFontColor('${color.hex}')">EDUSTA</button>
                    <button onclick="setAccent('${color.hex}')">KOROSTUS</button>
                </div>
            `;
            
            paletteContainer.appendChild(card);
        });

        function setBg(color) {
            document.documentElement.style.setProperty("--my-background", color);
            console.log('Set BG:' + color)
        }

        function setFontColor(color) {
            document.documentElement.style.setProperty("--my-foreground", color);
            console.log('Set Font color:' + color)
        }

        function setAccent(color) {
            document.documentElement.style.setProperty("--my-accent", color);
            applyPaletteOverride(color);

            console.log('Set Font color:' + color)
        }

        function applyPaletteOverride(color) {
            // Check if we already created an override tag, otherwise create one
            let styleTag = document.getElementById("font-palette-override");
            if (!styleTag) {
                styleTag = document.createElement("style");
                styleTag.id = "font-palette-override";
                document.head.appendChild(styleTag);
            }

            // Set the content (this overwrites previous attempts)
            styleTag.textContent = `
                @font-palette-values --DefaultPalette {
                    font-family: "MONKEY.000";
                    override-colors: 0 ${color};
                }
            `;
        }
    </script>
</body>
</html>
