<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGA Palette Selector</title>
    <style>
        :root {
            --my-background: #f0f0f0;
            --my-foreground: #333;
            --my-accent: #FFFFFF;

            --h1-font: "HORIZON1994";
            --text-font: "MONKEY.000";
        }

        @font-face {
            font-family: "HORIZON1994";
            src: url("http://verso.chat/horizon1994-large-corrected.woff2");
            font-smooth: never;
            -webkit-font-smoothing: none;
        }

        @font-face {
            font-family: "Courier Prime";
            src: url("http://verso.chat/CourierPrime-Regular.ttf");
        }

        @font-face {
            font-family: "MONKEY.000";
            src: url("http://verso.chat/MONKEY.000.ttf");
        }

        @font-palette-values --DefaultPalette {
            font-family: "MONKEY.000";
            override-colors: 0 #FFFFFF;
        }

        body {
            font-family: var(--text-font), "Courier Prime", Courier, monospace;
            background-color: var(--my-background);
            padding: 20px;
            color: var(--my-foreground);
            font-palette: --DefaultPalette;
        }

        h1 {
            font-family: var(--h1-font);
            text-align: center;
            text-transform: uppercase;
            padding-bottom: 10px;
            font-weight: normal;
            font-style: normal;
            background-color: var(--my-accent);
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .color-card {
            font-family: "Courier Prime";
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .swatch {
            width: 60px;
            height: 60px;
            border: 1px solid #000;
            flex-shrink: 0;
        }

        .info {
            flex-grow: 1;
        }

        .color-name {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        button {
            cursor: pointer;
            font-size: 0.7rem;
            padding: 4px;
            border: 1px solid #333;
            background: #eee;
            text-align: left;
        }

        button:hover {
            background: #ddd;
        }
    </style>
</head>
<body>

    <h1>VILLE SUNDELL - DIGIVIHREÄ</h1>

    <p style="text-align:center;">Leipäteksti</p>

    <div class="palette-grid" id="palette"></div>

    <h1>Fontit</h1>
    <p>Testiteksti</p>
    <div class="palette-grid" id="font"></div>

    <script>

            { "index": 6, "name": "Brown", "hex": "#AA5500" },
            { "index": 7, "name": "White / Light Gray", "hex": "#AAAAAA" },
            { "index": 8, "name": "Dark Gray", "hex": "#555555" },
            { "index": 9, "name": "Bright Blue", "hex": "#5555FF" },

            { "index": 14, "name": "Bright Yellow", "hex": "#FFFF55" },
            { "index": 15, "name": "Bright White", "hex": "#FFFFFF" },
            { "index": 16, "name": "Extended EGA", "hex": "#000055" },
            { "index": 17, "name": "Extended EGA", "hex": "#0000FF" },
            { "index": 18, "name": "Extended EGA", "hex": "#005500" },
            { "index": 19, "name": "Extended EGA", "hex": "#005555" },
            { "index": 20, "name": "Extended EGA", "hex": "#0055AA" },
            { "index": 21, "name": "Extended EGA", "hex": "#0055FF" },
            { "index": 22, "name": "Extended EGA", "hex": "#00AA55" },
            { "index": 23, "name": "Extended EGA", "hex": "#00AAFF" },
            { "index": 24, "name": "Extended EGA", "hex": "#00FF00" },
            { "index": 25, "name": "Extended EGA", "hex": "#00FF55" },
            { "index": 26, "name": "Extended EGA", "hex": "#00FFAA" },
            { "index": 27, "name": "Extended EGA", "hex": "#00FFFF" },
            { "index": 28, "name": "Extended EGA", "hex": "#550000" },
            { "index": 29, "name": "Extended EGA", "hex": "#550055" },
            { "index": 30, "name": "Extended EGA", "hex": "#5500AA" },
            { "index": 31, "name": "Extended EGA", "hex": "#5500FF" },
            { "index": 32, "name": "Extended EGA", "hex": "#555500" },
            { "index": 33, "name": "Extended EGA", "hex": "#5555AA" },
            { "index": 34, "name": "Extended EGA", "hex": "#55AA00" },
            { "index": 35, "name": "Extended EGA", "hex": "#55AA55" },
            { "index": 36, "name": "Extended EGA", "hex": "#55AAAA" },
            { "index": 37, "name": "Extended EGA", "hex": "#55AAFF" },
            { "index": 38, "name": "Extended EGA", "hex": "#55FF00" },
            { "index": 39, "name": "Extended EGA", "hex": "#55FFAA" },
            { "index": 40, "name": "Extended EGA", "hex": "#AA0055" },
            { "index": 41, "name": "Extended EGA", "hex": "#AA00FF" },
            { "index": 42, "name": "Extended EGA", "hex": "#AA5555" },
            { "index": 43, "name": "Extended EGA", "hex": "#AA55AA" },
            { "index": 44, "name": "Extended EGA", "hex": "#AA55FF" },

            { "index": 46, "name": "Extended EGA", "hex": "#AAAA55" },
            { "index": 47, "name": "Extended EGA", "hex": "#AAAAFF" },
            { "index": 48, "name": "Extended EGA", "hex": "#AAFF00" },
            { "index": 49, "name": "Extended EGA", "hex": "#AAFF55" },
            { "index": 50, "name": "Extended EGA", "hex": "#AAFFAA" },
            { "index": 51, "name": "Extended EGA", "hex": "#AAFFFF" },
            { "index": 52, "name": "Extended EGA", "hex": "#FF0000" },
            { "index": 53, "name": "Extended EGA", "hex": "#FF0055" },
            { "index": 54, "name": "Extended EGA", "hex": "#FF00AA" },
            { "index": 55, "name": "Extended EGA", "hex": "#FF00FF" },
            { "index": 56, "name": "Extended EGA", "hex": "#FF5500" },
            { "index": 57, "name": "Extended EGA", "hex": "#FF55AA" },
            { "index": 58, "name": "Extended EGA", "hex": "#FFAA00" },
            { "index": 59, "name": "Extended EGA", "hex": "#FFAA55" },
            { "index": 60, "name": "Extended EGA", "hex": "#FFAAAA" },
            { "index": 61, "name": "Extended EGA", "hex": "#FFAAFF" },
            { "index": 62, "name": "Extended EGA", "hex": "#FFFF00" },
            { "index": 63, "name": "Extended EGA", "hex": "#FFFFAA" }
        ];

        const fonts = [
            {name: "Pelifontti", family: "MONKEY.000"},
            {name: "Kirjoituskone", family: "Courier Prime"},
            {name: "IBM", family: "HORIZON1994"}
        ];

        const paletteContainer = document.getElementById('palette');

        egaColors.forEach(color => {
            const card = document.createElement('div');
            card.className = 'color-card';

            card.innerHTML = `
                <div class="swatch" style="background-color: ${color.hex};"></div>
                <div class="info" style="color:black;">
                    <span class="color-name">${color.name}</span>
                    <code>${color.hex}</code>
                </div>
                <div class="controls">
                    <button onclick="setBg('${color.hex}')">TAUSTA</button>
                    <button onclick="setFontColor('${color.hex}')">EDUSTA</button>
                    <button onclick="setAccent('${color.hex}')">KOROSTUS</button>
                </div>
            `;

            paletteContainer.appendChild(card);
        });

        const fontContainer = document.getElementById('font');

        fonts.forEach(font => {
            const card = document.createElement('div');
            card.className = 'color-card';

            card.innerHTML = `
                <div class="info" style="color:black; font-family: '${font.family}';">
                    <span class="color-name">${font.name}</span>
                    <code>${font.family}</code>
                </div>
                <div class="controls">
                    <button onclick="setH1Font('${font.family}')">OTSIKKO</button>
                    <button onclick="setTextFont('${font.family}')">LEIPÄTEKSTI</button>
                </div>
            `;

            fontContainer.appendChild(card);
        });

        function setBg(color) {
            document.documentElement.style.setProperty("--my-background", color);
            console.log('Set BG:' + color)
        }

        function setFontColor(color) {
            document.documentElement.style.setProperty("--my-foreground", color);
            console.log('Set Font color:' + color)
        }

        function setAccent(color) {
            document.documentElement.style.setProperty("--my-accent", color);
            applyPaletteOverride(color);

            console.log('Set Font color:' + color)
        }

        function setH1Font(font) {
            document.documentElement.style.setProperty("--h1-font", `"${font}"`);
        }

        function setTextFont(font) {
            document.documentElement.style.setProperty("--text-font", `"${font}"`);
        }

        function applyPaletteOverride(color) {
            // Check if we already created an override tag, otherwise create one
            let styleTag = document.getElementById("font-palette-override");
            if (!styleTag) {
                styleTag = document.createElement("style");
                styleTag.id = "font-palette-override";
                document.head.appendChild(styleTag);
            }

            // Set the content (this overwrites previous attempts)
            styleTag.textContent = `
                @font-palette-values --DefaultPalette {
                    font-family: "MONKEY.000";
                    override-colors: 0 ${color};
                }
            `;
        }
    </script>
</body>
</html>
